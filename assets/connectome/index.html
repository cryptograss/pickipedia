<!doctype html>
<!--
  The connectome's big graph: what opens when a reader clicks a line, a dot or the rabbit on a musician
  page's connectome card ({{#connectome:}}), over the page; and a page of its own at /assets/connectome/.

    ?a=Kyle+Tuttle&b=Bronwyn    two pickers: what they've played together, and who both have played with
    ?p=Kyle+Tuttle              one picker and their company
    (?from= and ?to= are read as a and b)

  A pointer that hovers gets a note beside what it's over, and its click goes further in. A finger can't
  hover: its touch opens a sheet saying what it touched, with the ways further in, the page, and the way back
  to the graph as buttons.

  connectome-core.js decides what a view holds and where it sits; connectome.js draws it; graph.json, built
  at deploy by tools/connectome_card.py, is everything it knows. No library, and nothing fetched from
  another site.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The connectome · PickiPedia</title>
<link rel="stylesheet" href="connectome.css">
</head>
<body>
<header class="bar">
	<button type="button" id="back" title="Back to where you were" hidden>←</button>
	<label><span class="vh">A picker</span><input id="pa" list="names" autocomplete="off" spellcheck="false" placeholder="a picker"></label>
	<span class="join" aria-hidden="true">⟷</span>
	<label><span class="vh">Another picker</span><input id="pb" list="names" autocomplete="off" spellcheck="false" placeholder="connect to…"></label>
	<nav id="crumbs" aria-label="Where you have been"></nav>
</header>
<main>
	<section id="stage" aria-label="The graph">
		<div id="say"><h1></h1><p></p></div>
		<svg id="g" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="The connectome"></svg>
		<div id="tip" role="status" hidden></div>
		<div id="sheet" role="dialog" aria-label="What you touched" hidden></div>
		<div id="wait">Loading the connectome…</div>
		<footer id="legend">
			<span class="lg"><svg width="30" height="12" aria-hidden="true"><line class="glow" x1="2" y1="6" x2="28" y2="6"/><line class="core t2" x1="2" y1="6" x2="28" y2="6"/></svg>
				<a href="/wiki/PickiPedia:Release_Types" target="_top">Permanent Release</a>: a taper's tape or Creative Commons</span>
			<span class="lg"><svg width="30" height="12" aria-hidden="true"><line class="core t1" x1="2" y1="6" x2="28" y2="6"/></svg>
				<a href="/wiki/PickiPedia:Release_Types" target="_top">Full Release</a>: no DRM</span>
			<span class="lg"><svg width="30" height="12" aria-hidden="true"><line class="core t0" x1="2" y1="6" x2="28" y2="6"/></svg>
				the rest: counted, not named</span>
			<span class="lg more"><svg width="16" height="12" aria-hidden="true"><g class="gl" transform="translate(8 6)"><rect x="-6.8" y="-4.6" width="13.6" height="9.2" rx="1.8"/><circle cx="-2.9" r="1.5"/><circle cx="2.9" r="1.5"/></g></svg> a show
				<svg width="14" height="12" aria-hidden="true"><g class="gl" transform="translate(7 6)"><circle r="5.2"/><circle class="f" r="1.4"/></g></svg> a record
				<svg width="12" height="12" aria-hidden="true"><g class="gl" transform="translate(6 6.5) scale(0.9)"><circle class="f" cx="-2" cy="3.6" r="2.7"/><path d="M0.4 3.6V-5.2L4.6 -3.4"/></g></svg> a track</span>
			<span class="lg more"><svg width="14" height="12" aria-hidden="true"><circle class="dot" cx="7" cy="6" r="4"/></svg> a picker
				<svg width="14" height="12" aria-hidden="true"><circle class="dot hollow" cx="7" cy="6" r="4"/></svg> no page yet</span>
			<span class="lg more">thicker, bigger = more together</span>
		</footer>
	</section>
	<aside id="panel" aria-label="What the sources say"></aside>
</main>
<datalist id="names"></datalist>
<script type="module" src="connectome.js"></script>
</body>
</html>
